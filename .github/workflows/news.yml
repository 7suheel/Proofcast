name: News

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions: {}

concurrency:
  group: proofcast-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --no-dev
      - name: Fetch news (RSS)
        run: uv run --no-dev proofcast fetch news
      - name: Commit
        run: 'scripts/commit-data.sh "data: hourly news fetch"'
