name: News

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions: {}

concurrency:
  group: proofcast-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --no-dev
      - name: Fetch news (RSS)
        run: uv run --no-dev proofcast fetch news
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'scripts/commit-data.sh "data: hourly news fetch"'
