# ---------------------------------------------------------------------------
# Macro series (FRED). release_lag_days is a conservative estimate of how long after the end
# of the observation period a value becomes public; used when the FRED API (with a key) cannot
# tell us the real first-release date.
# ---------------------------------------------------------------------------

[[macro]]
series_id = "FEDFUNDS"
name = "Effective federal funds rate (monthly)"
frequency = "monthly"
release_lag_days = 3

[[macro]]
series_id = "CPIAUCSL"
name = "Consumer price index, all urban consumers (monthly)"
frequency = "monthly"
release_lag_days = 16

[[macro]]
series_id = "DGS10"
name = "10-year Treasury constant maturity yield (daily)"
frequency = "daily"
release_lag_days = 1

[[macro]]
series_id = "UNRATE"
name = "Unemployment rate (monthly)"
frequency = "monthly"
release_lag_days = 10

[[macro]]
series_id = "SP500"
name = "S&P 500 index (daily, used for market context)"
frequency = "daily"
release_lag_days = 1
