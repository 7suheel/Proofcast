# Proofcast configuration.
# Not investment advice. Forecasts can be wrong. Past performance does not predict future results.

[project]
name = "Proofcast"
site_url = "https://7suheel.github.io/proofcast/"
repo_url = "https://github.com/7suheel/proofcast"
data_dir = "data"
ledger_path = "ledger/forecasts.jsonl"
cache_dir = ".cache/http"

[forecast]
# Horizons in calendar days. Question: "closes higher than the reference close".
horizons = [7, 30]
# Probabilities are clamped to this range (rule 3: no false certainty).
min_probability = 0.05
max_probability = 0.95

[history]
years = 10
# A drawdown counts as "major" when the peak-to-trough fall is deeper than this.
stock_drawdown_threshold = 0.20
crypto_drawdown_threshold = 0.35
# Evidence window: from this many days before the drawdown start until the trough.
evidence_days_before = 7
# Benchmarks used for "was it the whole market?" context.
stock_benchmark = "SP500"
crypto_benchmark = "BTC"

[schedules]
# Cron expressions (UTC) used by the GitHub Actions workflows. Documented here for reference;
# the workflow files are the source of truth for GitHub.
news = "17 * * * *"
daily_data = "30 22 * * 1-5"
crypto_data = "20 0 * * *"
forecasts = "0 23 * * *"
resolve_score = "30 23 * * *"
site = "0 0 * * *"

[sources.stocks]
# Price source chain for US stocks, tried in order. "yahoo" is unofficial and only used when
# allow_unofficial = true (see docs/data-sources.md).
providers = ["stooq", "yahoo"]
allow_unofficial = true

[sources.crypto]
# CoinGecko for recent prices (public API keeps ~365 days), Coinbase Exchange public candles
# for long history.
providers = ["coinbase", "coingecko"]

[sources.gdelt]
enabled = true
min_interval_seconds = 5.5

[[sources.rss]]
name = "CNBC Top News"
url = "https://www.cnbc.com/id/100003114/device/rss/rss.html"

[[sources.rss]]
name = "CNBC Finance"
url = "https://www.cnbc.com/id/10000664/device/rss/rss.html"

[[sources.rss]]
name = "CoinDesk"
url = "https://www.coindesk.com/arc/outboundfeeds/rss/"

[[sources.rss]]
name = "Cointelegraph"
url = "https://cointelegraph.com/rss"

[[sources.rss]]
name = "SEC press releases"
url = "https://www.sec.gov/news/pressreleases.rss"

